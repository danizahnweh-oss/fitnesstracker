// ─────────────────────────────────────────────────────────────
// STORAGE  (theme-scoped so the 3 variants don't fight)
// ─────────────────────────────────────────────────────────────
function storageKey(theme) {
  return `fittracker_v2_${theme || 'default'}`;
}

function loadState(theme) {
  try {
    return JSON.parse(localStorage.getItem(storageKey(theme)) || '{}');
  } catch { return {}; }
}

function saveState(theme, state) {
  try { localStorage.setItem(storageKey(theme), JSON.stringify(state)); }
  catch (e) { console.warn('save failed', e); }
}

function defaultState() {
  return {
    sessions: [],   // {date, sessionId, week, exercises, feel, notes, recovery:{sleep,soreness,energy,water}, prs}
    bodyweight: [], // {date, kg}
    water: [],      // {date, glasses}
    currentSessionIdx: 0,
    weekNo: 1,
    customExercises: [],   // user-added
    replacements: {},      // {[sessionId-exId]: customExId}  -- swaps
    settings: {
      soundEnabled: true,
      soundKind: 'bell',         // bell | ding | beep | silent
      vibrationEnabled: true,
      barWeight: 20,
      rpeMode: 'rpe',            // 'rpe' (5-10) | 'rir' (0-4)
      warmupStyle: 'standard',   // 'standard' | 'wendler'
      pauseFirst: true,          // start pause immediately, log details during
      wakeLockEnabled: true,
      availablePlates: { 25: 2, 20: 2, 15: 2, 10: 2, 5: 2, 2.5: 2, 1.25: 2 },
    },
  };
}

function mergeDefaults(state) {
  const def = defaultState();
  return { ...def, ...state, settings: { ...def.settings, ...(state.settings || {}) } };
}

// ─────────────────────────────────────────────────────────────
// PROGRESSION
// Rule: if last session had all sets at target reps AND avg RPE ≤ ceiling,
// suggest +increment. Otherwise keep last weight.
// ─────────────────────────────────────────────────────────────
function rpeCeiling(ex) {
  if (ex.type === 'isolation' || ex.type === 'isolation_db') return 8.5;
  return 8;
}

function suggestNextWeight(ex, lastSession) {
  if (!lastSession) return ex.weight;
  const exHist = (lastSession.exercises || []).find(e => e.id === ex.id);
  if (!exHist) return ex.weight;
  const sets = exHist.sets || [];
  const lastWeight = exHist.weight ?? ex.weight;
  if (!sets.length) return lastWeight;
  const allDone = sets.length >= ex.sets && sets.every(s => (s.reps || 0) >= ex.reps);
  const rpes = sets.map(s => s.rpe).filter(r => r > 0);
  const avgRPE = rpes.length ? rpes.reduce((a, b) => a + b, 0) / rpes.length : 0;
  if (allDone && avgRPE > 0 && avgRPE <= rpeCeiling(ex)) {
    return lastWeight + ex.increment;
  }
  return lastWeight;
}

function findLastSession(state, sessionId) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    if (state.sessions[i].sessionId === sessionId) return state.sessions[i];
  }
  return null;
}

function findLastForExercise(state, exId) {
  // last session that contained this exercise
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    const e = (s.exercises || []).find(x => x.id === exId);
    if (e) return { date: s.date, weight: e.weight, sets: e.sets, sessionId: s.sessionId };
  }
  return null;
}

function exerciseHistory(state, exId, limit = 30) {
  const out = [];
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    const e = (s.exercises || []).find(x => x.id === exId);
    if (e) out.push({ date: s.date, weight: e.weight, sets: e.sets });
    if (out.length >= limit) break;
  }
  return out.reverse();
}

// ─────────────────────────────────────────────────────────────
// 1RM  (Epley) and warmup generator
// ─────────────────────────────────────────────────────────────
function estimate1RM(weight, reps) {
  if (!weight || !reps) return 0;
  return weight * (1 + reps / 30);
}

function bestEstimate1RM(state, exId) {
  const hist = exerciseHistory(state, exId, 999);
  let best = 0;
  hist.forEach(h => {
    (h.sets || []).forEach(s => {
      const r = estimate1RM(h.weight, s.reps);
      if (r > best) best = r;
    });
  });
  return best;
}

// Auto-warmups: if no explicit warmups, build 2 from the work weight
function generateWarmups(ex, workWeight) {
  if (ex.warmups && ex.warmups.length) {
    // explicit, but anchor working sets onto suggested weight
    return ex.warmups;
  }
  if (ex.type === 'isolation' || ex.type === 'isolation_db') return [];
  const w1 = Math.max(ex.bar || 20, roundToPlate(workWeight * 0.5));
  const w2 = roundToPlate(workWeight * 0.75);
  if (w2 <= (ex.bar || 20)) return [];
  return [
    { w: w1, r: 8 },
    { w: w2, r: 5 },
  ];
}

function roundToPlate(w, step = 2.5) {
  return Math.round(w / step) * step;
}

// ─────────────────────────────────────────────────────────────
// PLATE CALCULATOR
// ─────────────────────────────────────────────────────────────
const PLATE_COLORS = {

  10: '#10B981', 5: '#FFFFFF', 2.5: '#1F2937', 1.25: '#94A3B8',
};

function calcPlates(target, bar = 20) {
  const out = [];
  if (target < bar) return { ok: false, plates: [], remainder: target, bar };
  let perSide = (target - bar) / 2;
  const sizes = [25, 20, 15, 10, 5, 2.5, 1.25];
  for (const p of sizes) {
    while (perSide >= p - 0.0001) {
      out.push(p);
      perSide -= p;
    }
  }
  return { ok: Math.abs(perSide) < 0.0001, plates: out, remainder: perSide, bar };
}

// ─────────────────────────────────────────────────────────────
// BOXING BELL  via Web Audio (no asset, no licensing)
// ─────────────────────────────────────────────────────────────
let _ac = null;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}

function playBell(enabled = true) {
  if (!enabled) return;
  try {
    const ctx = getAC();
    const now = ctx.currentTime;
    // 3 quick strikes of the bell — boxing round ending
    [0, 0.18, 0.36].forEach((delay) => {
      // Bell = inharmonic stack
      const partials = [
        { f: 920,  g: 0.45, t: 'triangle' },
        { f: 1380, g: 0.30, t: 'sine'     },
        { f: 2300, g: 0.18, t: 'sine'     },
        { f: 3300, g: 0.10, t: 'sine'     },
      ];
      const masterGain = ctx.createGain();
      masterGain.connect(ctx.destination);
      masterGain.gain.setValueAtTime(0.0001, now + delay);
      masterGain.gain.exponentialRampToValueAtTime(1.0, now + delay + 0.005);
      masterGain.gain.exponentialRampToValueAtTime(0.001, now + delay + 1.3);

      partials.forEach(p => {
        const o = ctx.createOscillator();
        o.type = p.t; o.frequency.value = p.f;
        const g = ctx.createGain();
        g.gain.value = p.g;
        o.connect(g); g.connect(masterGain);
        o.start(now + delay);
        o.stop(now + delay + 1.4);
      });
    });
  } catch (e) { console.warn('bell failed', e); }
}

function playClick() {
  try {
    const ctx = getAC();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 1200;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.start(t); o.stop(t + 0.08);
  } catch {}
}

function fmtTime(s) {
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return `${m}:${String(ss).padStart(2, '0')}`;
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
}

function daysAgo(iso) {
  const d = new Date(iso);
  const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (diff === 0) return 'heute';
  if (diff === 1) return 'gestern';
  return `vor ${diff} T`;
}

function fmtWeight(w) {
  if (w === 'Stange' || w == null) return w || '';
  if (Number.isInteger(w)) return String(w);
  return w.toString().replace('.', ',');
}

function suggestSessionToday(state) {
  // Cycle through A → B → C. Pick the next-in-cycle. If today matches Mon/Wed/Fri
  // and that matches the next one, perfect; if user is "off-cycle" we still
  // suggest the next-in-cycle so they don't repeat one.
  const idx = state.currentSessionIdx ?? 0;
  return SESSION_ORDER[idx % SESSION_ORDER.length];
}

function getCues(exId) { return FORM_CUES[exId] || null; }
function getMuscles(exId) { return MUSCLE_MAP[exId] || []; }

// ─────────────────────────────────────────────────────────────
// STREAK + STATS HELPERS
// ─────────────────────────────────────────────────────────────
function calcStreak(state) {
  if (!state.sessions.length) return 0;
  const dates = new Set(state.sessions.map(s => s.date));
  // Walk back from today; on each Mon/Wed/Fri, check if there's a session.
  let streak = 0;
  const today = new Date();
  // Allow today to be missing (workout maybe hasn't happened yet)
  for (let d = new Date(today), guard = 0; guard < 90; guard++, d.setDate(d.getDate() - 1)) {
    const dow = d.getDay();
    if (dow !== 1 && dow !== 3 && dow !== 5) continue;
    const iso = d.toISOString().slice(0, 10);
    if (dates.has(iso)) {
      streak++;
    } else {
      // skip today's missing — gym day not done yet
      if (iso === today.toISOString().slice(0, 10)) continue;
      break;
    }
  }
  return streak;
}

function sessionVolume(session) {
  return (session.exercises || []).reduce((vol, e) => {
    return vol + (e.sets || []).reduce((v, s) => v + (s.reps || 0) * (e.weight || 0), 0);
  }, 0);
}

function volumeByMuscle(state, days = 7) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
  const cutoffISO = cutoff.toISOString().slice(0, 10);
  const result = {};
  state.sessions.forEach(s => {
    if (s.date < cutoffISO) return;
    (s.exercises || []).forEach(e => {
      const muscles = getMuscles(e.id);
      if (!muscles.length) return;
      const exVol = (e.sets || []).reduce((v, st) => v + (st.reps || 0) * (e.weight || 0), 0);
      const per = exVol / muscles.length;
      muscles.forEach(m => { result[m] = (result[m] || 0) + per; });
    });
  });
  return result;
}

// PR detection: compare current session's estimated 1RM vs all prior history
function detectPRs(state, currentSessionLog) {
  const prs = [];
  (currentSessionLog.exercises || []).forEach(e => {
    if (!e.sets?.length) return;
    const bestSetThis = e.sets.reduce((b, s) =>
      ((s.reps || 0) > 0 && estimate1RM(e.weight, s.reps) > (b ? estimate1RM(e.weight, b.reps) : 0))
        ? s : b, null);
    if (!bestSetThis) return;
    let bestPrior = 0;
    state.sessions.forEach(s => {
      (s.exercises || []).forEach(prev => {
        if (prev.id !== e.id) return;
        (prev.sets || []).forEach(ps => {
          const r = estimate1RM(prev.weight, ps.reps);
          if (r > bestPrior) bestPrior = r;
        });
      });
    });
    const thisEst = estimate1RM(e.weight, bestSetThis.reps);
    if (thisEst > bestPrior + 0.5 && bestPrior > 0) {
      prs.push({ id: e.id, name: e.name, weight: e.weight, reps: bestSetThis.reps, est: Math.round(thisEst) });
    }
  });
  return prs;
}

// Detect stall — 2+ sessions same type, same weight, missed reps
function detectStall(state, sessionId, exId) {
  const sessions = state.sessions.filter(s => s.sessionId === sessionId);
  if (sessions.length < 2) return false;
  const [a, b] = sessions.slice(-2);
  const eA = (a.exercises || []).find(e => e.id === exId);
  const eB = (b.exercises || []).find(e => e.id === exId);
  if (!eA || !eB) return false;
  return eA.weight === eB.weight;
}

// PR list (all-time best 1RM per exercise)
function allTimePRs(state) {
  const m = {};
  state.sessions.forEach(s => {
    (s.exercises || []).forEach(e => {
      (e.sets || []).forEach(st => {
        const est = estimate1RM(e.weight, st.reps);
        if (!m[e.id] || est > m[e.id].est) {
          m[e.id] = { id: e.id, name: e.name, weight: e.weight, reps: st.reps, est, date: s.date };
        }
      });
    });
  });
  return Object.values(m).sort((a, b) => b.est - a.est);
}

// ─────────────────────────────────────────────────────────────
// WARMUP GENERATORS
// ─────────────────────────────────────────────────────────────
function generateWarmupsWendler(ex, workWeight) {
  if (ex.type === 'isolation' || ex.type === 'isolation_db') return [];
  if (workWeight <= (ex.bar || 20)) return [];
  return [
    { w: Math.max(ex.bar || 20, roundToPlate(workWeight * 0.4, 2.5)), r: 5 },
    { w: Math.max(ex.bar || 20, roundToPlate(workWeight * 0.5, 2.5)), r: 5 },
    { w: Math.max(ex.bar || 20, roundToPlate(workWeight * 0.6, 2.5)), r: 3 },
  ];
}

function generateWarmupsBy(style, ex, workWeight) {
  // Respect plan-provided warmups regardless of style
  if (ex.warmups && ex.warmups.length) return ex.warmups;
  if (style === 'wendler') return generateWarmupsWendler(ex, workWeight);
  return generateWarmups(ex, workWeight);
}

// ─────────────────────────────────────────────────────────────
// SOUND VARIANTS
// ─────────────────────────────────────────────────────────────
function playDing() {
  try {
    const ctx = getAC();
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 1480;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.4, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
    o.start(t); o.stop(t + 1.7);
  } catch {}
}

function playBeep() {
  try {
    const ctx = getAC();
    [0, 0.18].forEach((d) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 1000;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + d;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    });
  } catch {}
}

function playSound(kind, settings) {
  if (!settings || !settings.soundEnabled) {
    if (settings?.vibrationEnabled && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    return;
  }
  if (settings.vibrationEnabled && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
  if (kind === 'silent' || kind === 'none') return;
  if (kind === 'ding') return playDing();
  if (kind === 'beep') return playBeep();
  return playBell(true);
}

// ─────────────────────────────────────────────────────────────
// WAKE LOCK (keep screen awake during workout)
// ─────────────────────────────────────────────────────────────
let _wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return false;
  try {
    _wakeLock = await navigator.wakeLock.request('screen');
    return true;
  } catch { return false; }
}
function releaseWakeLock() {
  if (_wakeLock) { try { _wakeLock.release(); } catch {} _wakeLock = null; }
}

// ─────────────────────────────────────────────────────────────
// RPE/RIR conversion
// ─────────────────────────────────────────────────────────────
function rpeToRir(rpe) { return Math.max(0, 10 - rpe); }
function rirToRpe(rir) { return 10 - rir; }

// ─────────────────────────────────────────────────────────────
// CUSTOM EXERCISES (merge with plan via replacements map)
// ─────────────────────────────────────────────────────────────
function getSessionExercises(state, sessionId) {
  const session = TRAINING_PLAN[sessionId];
  if (!session) return [];
  return session.exercises.map(ex => {
    const key = `${sessionId}-${ex.id}`;
    const replId = state.replacements?.[key];
    if (replId) {
      const custom = (state.customExercises || []).find(c => c.id === replId);
      if (custom) return { ...custom, replacedFrom: ex.id };
    }
    return ex;
  });
}

// ─────────────────────────────────────────────────────────────
// EXPORT TO WINDOW
// ─────────────────────────────────────────────────────────────
window.FT = {
  TRAINING_PLAN, SESSION_ORDER, SESSION_DOW, PLATE_COLORS,
  MUSCLE_MAP, FORM_CUES,
  loadState, saveState, defaultState, mergeDefaults,
  suggestNextWeight, findLastSession, findLastForExercise, exerciseHistory,
  estimate1RM, bestEstimate1RM, generateWarmups, generateWarmupsWendler, generateWarmupsBy,
  roundToPlate, calcPlates,
  playBell, playDing, playBeep, playClick, playSound,
  fmtTime, todayISO, fmtDate, daysAgo, fmtWeight,
  suggestSessionToday, rpeCeiling,
  // new
  calcStreak, sessionVolume, volumeByMuscle, detectPRs, detectStall, allTimePRs,
  getCues, getMuscles, getSessionExercises,
  requestWakeLock, releaseWakeLock,
  rpeToRir, rirToRpe,
};

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (

      <input type="range" className="twk-slider" min={min} max={max} step={step}

}

function TweakToggle({ label, value, onChange }) {
  return (

      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

      </div>

      {/* STEIGERUNGS-BANNER */}
      <ProgressionBanner theme={theme} session={session} suggestions={suggestions} weekNo={state.weekNo} />

      {/* HERO: today's session */}
      <div style={{ padding: '0 22px 18px' }}>
        <Card theme={theme} style={{ padding: 24, position: 'relative', overflow: 'hidden' }}>
          <div style={{
            position: 'absolute', top: -40, right: -40, width: 200, height: 200,
            borderRadius: '50%', background: `radial-gradient(circle, ${theme.accent}30 0%, transparent 65%)`,
          }} />
          <Label theme={theme}>Heute</Label>
          <div style={{ height: 4 }} />
          <Heading theme={theme} size="xxl" style={{ color: theme.accent, fontSize: 64 }}>
            {session.id}
          </Heading>
          <div style={{ marginTop: -4, fontFamily: theme.fontDisplay, fontSize: 22, fontWeight: theme.weightHeavy,
            color: theme.text, letterSpacing: theme.upperHeads ? 1 : -0.3,
            textTransform: theme.upperHeads ? 'uppercase' : 'none' }}>
            {session.name}
          </div>
          <div style={{ color: theme.muted, fontSize: 13, marginTop: 4 }}>
            {session.day} · {session.focus} · {session.exercises.length} Übungen
          </div>

          <div style={{ height: 16 }} />
          <Btn theme={theme} kind="primary" full onClick={onStart}>
            Session starten →
          </Btn>
        </Card>
      </div>

      {/* Today's exercises preview */}
      <div style={{ padding: '0 22px 18px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
          <Label theme={theme}>Plan heute</Label>
          <span style={{ fontSize: 11, color: theme.muted }}>
            {lastSession ? `zuletzt: ${FT.daysAgo(lastSession.date)}` : 'neue Session'}
          </span>
        </div>
        <Card theme={theme} style={{ padding: 6 }}>
          {suggestions.map((s, i) => (
            <div key={s.ex.id} style={{
              display: 'flex', alignItems: 'center', padding: '12px 14px',
              borderBottom: i < suggestions.length - 1 ? `1px solid ${theme.border}` : 'none',
              gap: 12,
            }}>
              <div style={{
                width: 28, height: 28, borderRadius: 8,
                background: theme.surface2, display: 'flex', alignItems: 'center',
                justifyContent: 'center', color: theme.accent, fontSize: 12,
                fontWeight: 700, fontFamily: theme.fontMono,
              }}>{i + 1}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{s.ex.name}</div>
                <div style={{ fontSize: 11, color: theme.muted, marginTop: 1, fontFamily: theme.fontMono }}>
                  {s.ex.sets}×{s.ex.reps} · Pause {s.ex.restRange}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 17, fontWeight: 700, fontFamily: theme.fontDisplay, color: theme.text }}>
                  {FT.fmtWeight(s.w)}<span style={{ fontSize: 11, color: theme.muted, marginLeft: 3 }}>kg</span>
                </div>
                {s.last && s.w > (s.last.weight || 0) && (
                  <div style={{ fontSize: 10, color: theme.success, fontWeight: 700 }}>
                    +{FT.fmtWeight(s.w - s.last.weight)}kg ↑
                  </div>
                )}
                {s.last && s.w === s.last.weight && (
                  <div style={{ fontSize: 10, color: theme.muted, fontWeight: 600 }}>
                    halten
                  </div>
                )}
              </div>
            </div>
          ))}
        </Card>
      </div>

      {/* Tools strip */}
      <div style={{ padding: '0 22px 18px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <Card theme={theme} style={{ padding: 14 }} onClick={onOpenPlates}>
          <Label theme={theme}>Tool</Label>
          <div style={{ marginTop: 6, fontSize: 15, fontWeight: 700 }}>Plate Calc</div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>Welche Scheiben?</div>
        </Card>
        <Card theme={theme} style={{ padding: 14 }} onClick={() => {
          const v = parseFloat(bwInput.replace(',', '.'));
          if (v > 30 && v < 300) {
            setState(s => ({ ...s, bodyweight: [...s.bodyweight, { date: FT.todayISO(), kg: v }] }));
            setBwInput('');
          }
        }}>
          <Label theme={theme}>Bodyweight</Label>
          <div style={{ marginTop: 6, display: 'flex', alignItems: 'baseline', gap: 4 }}>
            <input value={bwInput} onChange={e => setBwInput(e.target.value)}
              placeholder={lastBW ? FT.fmtWeight(lastBW.kg) : '—'}
              style={{
                width: 50, background: 'transparent', border: 'none', outline: 'none',
                color: theme.text, fontSize: 15, fontWeight: 700, fontFamily: 'inherit',
              }} />
            <span style={{ fontSize: 11, color: theme.muted }}>kg</span>
          </div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>
            {lastBW ? `zuletzt ${FT.daysAgo(lastBW.date)}` : 'eintragen'}
          </div>
        </Card>
      </div>

      {/* Recent sessions */}
      {recentSessions.length > 0 && (
        <div style={{ padding: '0 22px 18px' }}>
          <Label theme={theme} style={{ marginBottom: 10 }}>Letzte Sessions</Label>
          <div style={{ display: 'flex', gap: 10, overflowX: 'auto', padding: '2px 0' }}>
            {recentSessions.map(s => {
              const sess = FT.TRAINING_PLAN[s.sessionId];
              const setCount = (s.exercises || []).reduce((a, e) => a + (e.sets?.length || 0), 0);
              return (
                <div key={s.date + s.sessionId} style={{
                  minWidth: 110, padding: 14, borderRadius: theme.radius,
                  background: theme.surface, border: `1px solid ${theme.border}`,
                }}>
                  <Pill theme={theme} color={theme.accent} fill>{s.sessionId}</Pill>
                  <div style={{ marginTop: 8, fontSize: 13, fontWeight: 700 }}>{sess?.name}</div>
                  <div style={{ fontSize: 11, color: theme.muted, fontFamily: theme.fontMono, marginTop: 4 }}>
                    {FT.fmtDate(s.date)} · {setCount} Sätze
                  </div>
                  {s.feel && (
                    <div style={{ marginTop: 6, fontSize: 12 }}>
                      {'★'.repeat(s.feel)}<span style={{ color: theme.muted }}>{'☆'.repeat(5 - s.feel)}</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{ height: 30 }} />
    </div>
  );
}

function IconBtn({ theme, onClick, children, label }) {
  return (
    <button onClick={onClick} aria-label={label} style={{
      width: 38, height: 38, borderRadius: theme.radius,
      background: theme.surface, border: `1px solid ${theme.border}`,
      color: theme.text, cursor: 'pointer',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>{children}</button>
  );
}

// ─────────────────────────────────────────────────────────────
// PROGRESSION BANNER — "Heute steigern: Kniebeugen +2.5kg, …"
// Only shows when at least one ex actually has a +increment vs last time.
// ─────────────────────────────────────────────────────────────
function ProgressionBanner({ theme, session, suggestions, weekNo }) {
  const bumps = suggestions
    .map(s => ({ name: s.ex.name, delta: s.last ? s.w - s.last.weight : 0, w: s.w }))
    .filter(b => b.delta > 0);
  const holds = suggestions
    .filter(s => s.last && s.w === s.last.weight)
    .map(s => s.ex.name);

  if (weekNo <= 1) {
    return (
      <div style={{ padding: '0 22px 18px' }}>
        <div style={{
          padding: '12px 14px', borderRadius: theme.radius,
          background: theme.surface, border: `1px dashed ${theme.borderStrong}`,
          fontSize: 12, color: theme.mutedStrong, lineHeight: 1.5,
        }}>
          <strong style={{ color: theme.accent2, letterSpacing: 0.5 }}>WOCHE 1</strong> · Erst eingrooven.
          Ab Woche 2 zieht die Auto-Progression an.
        </div>
      </div>
    );
  }

  if (bumps.length === 0 && holds.length === 0) return null;

  return (
    <div style={{ padding: '0 22px 18px' }}>
      <div style={{
        padding: '14px 14px', borderRadius: theme.radius,
        background: bumps.length
          ? `linear-gradient(135deg, ${theme.success}15, ${theme.accent}10)`
          : theme.surface,
        border: `1px solid ${bumps.length ? theme.success + '40' : theme.border}`,
      }}>
        {bumps.length > 0 && (
          <>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
              <span style={{ fontSize: 16 }}>📈</span>
              <div style={{
                fontSize: 11, fontWeight: 800, letterSpacing: 1.2,
                color: theme.success, fontFamily: theme.fontMono,
                textTransform: 'uppercase',
              }}>
                Heute steigern · {bumps.length} Übung{bumps.length === 1 ? '' : 'en'}
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {bumps.map(b => (
                <div key={b.name} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: theme.text }}>
                  <span>{b.name}</span>
                  <span style={{ fontFamily: theme.fontMono, fontWeight: 700 }}>
                    <span style={{ color: theme.success }}>+{FT.fmtWeight(b.delta)}kg</span>
                    <span style={{ color: theme.muted }}> → {FT.fmtWeight(b.w)}kg</span>
                  </span>
                </div>
              ))}
            </div>
          </>
        )}
        {holds.length > 0 && (
          <div style={{ marginTop: bumps.length ? 8 : 0, fontSize: 11, color: theme.muted, fontFamily: theme.fontMono }}>
            Halten: {holds.join(' · ')}
          </div>
        )}
      </div>
    </div>
  );
}

window.HomeScreen = HomeScreen;
window.Frame = Frame;
window.Btn = Btn;
window.Card = Card;
window.Pill = Pill;
window.Heading = Heading;
window.Label = Label;
window.IconBtn = IconBtn;
window.useAppState = useAppState;

  </script>
  <script type="text/babel">
/* global React, FT */
// app-workout.jsx — Workout flow orchestrator (REWORKED):
// • Pause-first: tap "Satz fertig" → rest timer starts immediately, log details DURING the pause
// • Big tap targets, inline plate calc, RIR/RPE switch, form-tag
// • Wake-lock while a workout is active
// • Replace exercise from custom list
//
// Card UI, rest timer overlay, and replace picker live in companion files:
//   app-workout-card.jsx  → ExerciseCard, SetRow, ReplacePicker
//   app-workout-rest.jsx  → RestTimerOverlay + RPE/RIR helpers

const { useState: useStateW, useEffect: useEffectW, useMemo: useMemoW } = React;

function WorkoutScreen({ theme, state, setState, sessionId, onExit, onComplete, onCelebrate, onOpenCoach }) {
  const session = FT.TRAINING_PLAN[sessionId];
  const exercises = useMemoW(() => FT.getSessionExercises(state, sessionId), [state, sessionId]);
  const lastSession = FT.findLastSession(state, sessionId);

  // Live working state
  const [live, setLive] = useStateW(() => exercises.map(ex => {
    const suggested = FT.suggestNextWeight(ex, lastSession);
    return {
      id: ex.id, weight: suggested,
      sets: Array.from({ length: ex.sets }, () => ({
        reps: null, rpe: null, form: 'sauber', note: '', done: false,
      })),
    };
  }));

  const [activeEx, setActiveEx] = useStateW(0);
  const [restState, setRestState] = useStateW(null);  // {exIdx, setIdx, duration, startedAt}
  const [summary, setSummary] = useStateW(null);
  const [showReplace, setShowReplace] = useStateW(null);  // exIdx or null
  const [inlinePlate, setInlinePlate] = useStateW(null); // {target, bar}

  // Wake Lock — keep screen on during a workout
  useEffectW(() => {
    if (state.settings.wakeLockEnabled) FT.requestWakeLock();
    return () => FT.releaseWakeLock();
  }, [state.settings.wakeLockEnabled]);

  const isSessionDone = useMemoW(() => live.every(l => l.sets.every(s => s.done)), [live]);

  // Tap "Satz fertig" → start rest IMMEDIATELY with defaults; log details during rest
  function startSetCompletion(exIdx, setIdx) {
    const ex = exercises[exIdx];
    // Defaults: target reps, RPE 7, form "sauber"
    setLive(prev => prev.map((l, i) => i !== exIdx ? l : {
      ...l,
      sets: l.sets.map((s, j) => j !== setIdx
        ? s : { reps: ex.reps, rpe: 7, form: 'sauber', note: '', done: true }),
    }));
    setRestState({
      exIdx, setIdx, duration: ex.rest, startedAt: Date.now(),
      nextLabel: nextSetLabel(exIdx, setIdx, exercises),
    });
    FT.playClick();
  }

  function updateCurrentSet(patch) {
    if (!restState) return;
    setLive(prev => prev.map((l, i) => i !== restState.exIdx ? l : {
      ...l,
      sets: l.sets.map((s, j) => j !== restState.setIdx ? s : { ...s, ...patch }),
    }));
  }

  function adjustWeight(exIdx, delta) {
    setLive(p => p.map((x, j) => j !== exIdx ? x : {
      ...x, weight: Math.max(0, Math.round((x.weight + delta) * 100) / 100),
    }));
  }

  // Auto-advance to first unfinished set's exercise
  useEffectW(() => {
    if (restState) return;
    for (let i = 0; i < live.length; i++) {
      const undone = live[i].sets.findIndex(s => !s.done);
      if (undone !== -1) { setActiveEx(i); return; }
    }
  }, [live, restState]);

  function nextSetLabel(exIdx, setIdx, exes) {
    if (setIdx + 1 < exes[exIdx].sets) {
      return `Satz ${setIdx + 2}/${exes[exIdx].sets} · ${FT.fmtWeight(live[exIdx].weight)}kg`;
    }
    if (exIdx + 1 < exes.length) return exes[exIdx + 1].name;
    return 'Session abschließen';
  }

  function finishSession() {
    const exercisesLog = live.map((l, i) => ({
      id: l.id,
      name: exercises[i].name,
      weight: l.weight,
      sets: l.sets.filter(s => s.done).map(s => ({
        reps: s.reps, rpe: s.rpe, form: s.form, note: s.note,
      })),
    })).filter(e => e.sets.length > 0);
    setSummary({ exercisesLog });
  }

  function saveSessionWithFeel(feel, notes, recovery) {
    const session_record = {
      date: FT.todayISO(),
      sessionId, week: state.weekNo,
      exercises: summary.exercisesLog,
      feel, notes, recovery: recovery || state.__pendingRecovery || null,
    };
    // PR detection
    const prs = FT.detectPRs(state, session_record);
    session_record.prs = prs;
    setState(s => ({
      ...s,
      sessions: [...s.sessions, session_record],
      currentSessionIdx: (s.currentSessionIdx + 1) % 3,
      __pendingRecovery: undefined,
    }));
    if (prs.length && onCelebrate) onCelebrate(prs);
    onComplete();
  }

  function applyReplacement(exIdx, customId) {
    const exId = exercises[exIdx].id;
    const key = `${sessionId}-${exId}`;
    setState(s => ({
      ...s,
      replacements: customId
        ? { ...(s.replacements || {}), [key]: customId }
        : Object.fromEntries(Object.entries(s.replacements || {}).filter(([k]) => k !== key)),
    }));
    setShowReplace(null);
  }

  if (summary) {
    return <SessionSummary theme={theme} session={session} exercises={exercises} summary={summary}
      lastSession={lastSession}
      onSave={saveSessionWithFeel} onCancel={() => setSummary(null)} />;
  }

  return (
    <div style={{ height: '100%', overflowY: 'auto', WebkitOverflowScrolling: 'touch', paddingTop: theme.padTop || 56, paddingBottom: `calc(20px + ${theme.padBot || '0px'})` }}>
      {/* Top bar */}
      <div style={{ padding: '12px 22px 8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <button onClick={onExit} style={{
          background: 'transparent', border: 'none', color: theme.muted,
          fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6,
          padding: 0, fontFamily: 'inherit',
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Beenden
        </button>
        <div style={{ display: 'flex', gap: 6 }}>
          <Pill theme={theme} color={theme.accent} fill style={{ fontSize: 11 }}>{session.id}</Pill>
          <span style={{ fontSize: 11, color: theme.muted, fontFamily: theme.fontMono, alignSelf: 'center' }}>
            Woche {state.weekNo}
          </span>
        </div>
      </div>

      {/* Session title */}
      <div style={{ padding: '4px 22px 14px' }}>
        <Heading theme={theme} size="xl" style={{ color: theme.text, fontSize: 30 }}>
          {session.name}
        </Heading>
      </div>

      {/* Exercise list */}
      <div style={{ padding: '0 22px 12px', display: 'flex', flexDirection: 'column', gap: 14 }}>
        {exercises.map((ex, i) => (
          <ExerciseCard key={ex.id + i} theme={theme} state={state} ex={ex} live={live[i]}
            active={i === activeEx} done={live[i].sets.every(s => s.done)}
            warmupStyle={state.settings.warmupStyle}
            onTap={() => setActiveEx(i)}
            onStartSet={(setIdx) => startSetCompletion(i, setIdx)}
            onAdjustWeight={(delta) => adjustWeight(i, delta)}
            onOpenPlates={() => setInlinePlate({ target: live[i].weight, bar: ex.bar || 20 })}
            onReplace={() => setShowReplace(i)}
          />
        ))}
      </div>

      {/* Finish */}
      <div style={{ padding: '8px 22px 20px' }}>
        <Btn theme={theme} kind={isSessionDone ? 'primary' : 'secondary'} full
          onClick={finishSession} disabled={!live.some(l => l.sets.some(s => s.done))}>
          {isSessionDone ? '✓ Session abschließen' : 'Frühzeitig beenden'}
        </Btn>
      </div>

      {/* REST + LOG OVERLAY */}
      {restState && (
        <RestTimerOverlay theme={theme}
          state={state}
          exercise={exercises[restState.exIdx]}
          setIdx={restState.setIdx}
          weight={live[restState.exIdx].weight}
          set={live[restState.exIdx].sets[restState.setIdx]}
          nextLabel={restState.nextLabel}
          duration={restState.duration}
          onUpdateSet={updateCurrentSet}
          onClose={() => setRestState(null)}
          onOpenPlates={() => setInlinePlate({ target: live[restState.exIdx].weight, bar: exercises[restState.exIdx].bar || 20 })}
        />
      )}

      {/* Inline plate calc */}
      {inlinePlate && (
        <PlateCalculator theme={theme} target={inlinePlate.target} bar={inlinePlate.bar}
          onClose={() => setInlinePlate(null)} />
      )}

      {/* Replace exercise picker */}
      {showReplace !== null && (
        <ReplacePicker theme={theme} state={state}
          ex={exercises[showReplace]}
          onPick={(customId) => applyReplacement(showReplace, customId)}
          onClose={() => setShowReplace(null)} />
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// SESSION SUMMARY
// ─────────────────────────────────────────────────────────────
function SessionSummary({ theme, session, exercises, summary, onSave, onCancel }) {
  const [feel, setFeel] = useStateW(4);
  const [notes, setNotes] = useStateW('');

  const totalVolume = summary.exercisesLog.reduce((vol, e) => {
    return vol + (e.sets || []).reduce((v, s) => v + (s.reps || 0) * (e.weight || 0), 0);
  }, 0);
  const totalSets = summary.exercisesLog.reduce((n, e) => n + (e.sets?.length || 0), 0);

  return (
    <div style={{ height: '100%', overflowY: 'auto', WebkitOverflowScrolling: 'touch', paddingTop: theme.padTop || 56, paddingBottom: `calc(30px + ${theme.padBot || '0px'})` }}>
      <div style={{ padding: '20px 22px 6px' }}>
        <Pill theme={theme} color={theme.success} fill>Session fertig</Pill>
        <div style={{ height: 12 }} />
        <Heading theme={theme} size="xl" style={{ color: theme.text }}>Stark gemacht.</Heading>
        <div style={{ color: theme.muted, fontSize: 13, marginTop: 4 }}>
          {session.name} · {totalSets} Sätze · {Math.round(totalVolume).toLocaleString('de-DE')} kg Volumen
        </div>
      </div>

      <div style={{ padding: '20px 22px 0' }}>
        <Label theme={theme} style={{ marginBottom: 8 }}>Wie hat sich's angefühlt?</Label>
        <div style={{ display: 'flex', gap: 6 }}>
          {[1, 2, 3, 4, 5].map(n => (
            <button key={n} onClick={() => setFeel(n)} style={{
              flex: 1, padding: '14px 0', borderRadius: theme.radius,
              background: feel >= n ? theme.accent : theme.surface,
              color: feel >= n ? theme.accentText : theme.muted,
              border: `1px solid ${feel >= n ? theme.accent : theme.border}`,
              fontSize: 18, cursor: 'pointer',
            }}>★</button>
          ))}
        </div>
        <div style={{ fontSize: 11, color: theme.muted, marginTop: 6, fontFamily: theme.fontMono }}>
          {['', 'mies', 'naja', 'okay', 'gut', 'top-form'][feel]}
        </div>
      </div>

      <div style={{ padding: '18px 22px 0' }}>
        <Label theme={theme} style={{ marginBottom: 6 }}>Tagebuch (optional)</Label>
        <textarea value={notes} onChange={e => setNotes(e.target.value)}
          placeholder="Schlaf? Energie? Stimmung?"
          style={{
            width: '100%', boxSizing: 'border-box', minHeight: 70,
            padding: 12, borderRadius: theme.radius, background: theme.surface,
            border: `1px solid ${theme.border}`, color: theme.text,
            fontSize: 13, fontFamily: 'inherit', outline: 'none', resize: 'none',
          }} />
      </div>

      <div style={{ padding: '18px 22px 0' }}>
        <Label theme={theme} style={{ marginBottom: 8 }}>Recap & nächste Session</Label>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {summary.exercisesLog.map((e, i) => {
            const exDef = exercises[i] || e;
            const fakeLast = { exercises: [e] };
            const nextW = FT.suggestNextWeight(exDef, fakeLast);
            const change = nextW - e.weight;
            return (
              <div key={e.id} style={{
                padding: 12, borderRadius: theme.radius,
                background: theme.surface, border: `1px solid ${theme.border}`,
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <div style={{ fontSize: 13, fontWeight: 700 }}>{e.name}</div>
                  <div style={{ fontSize: 11, color: theme.muted, fontFamily: theme.fontMono }}>
                    {e.weight}kg · {e.sets.map(s => s.reps).join('/')}
                  </div>
                </div>
                <div style={{ marginTop: 6, fontSize: 11, fontFamily: theme.fontMono,
                  color: change > 0 ? theme.success : theme.mutedStrong }}>
                  Nächste Session: <strong>{FT.fmtWeight(nextW)}kg</strong>
                  {change > 0 && ` · +${FT.fmtWeight(change)}kg ↑`}
                  {change === 0 && ` · halten`}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ padding: 22, display: 'flex', gap: 10 }}>
        <Btn theme={theme} kind="ghost" onClick={onCancel} style={{ flex: 1 }}>Zurück</Btn>
        <Btn theme={theme} kind="primary" onClick={() => onSave(feel, notes)} style={{ flex: 2 }}>
          Speichern
        </Btn>
      </div>
    </div>
  );
}

window.WorkoutScreen = WorkoutScreen;

  </script>
  <script type="text/babel">
/* global React, FT */
// app-workout-card.jsx — ExerciseCard + SetRow + ReplacePicker
//
// Used by WorkoutScreen (app-workout.jsx). Manages the per-exercise UI:
// collapsed list row → active expanded "ready" state with weight adjust,
// warm-up display, set rows, and the giant "Satz fertig" button on the
// current set.

// ─────────────────────────────────────────────────────────────
// EXERCISE CARD — collapsed list, active = expanded ready-state
// ─────────────────────────────────────────────────────────────
function ExerciseCard({ theme, state, ex, live, active, done, warmupStyle, onTap, onStartSet, onAdjustWeight, onOpenPlates, onReplace }) {
  const last = FT.findLastForExercise(state, ex.id);
  const change = last ? live.weight - (last.weight || live.weight) : 0;
  const warmups = FT.generateWarmupsBy(warmupStyle, ex, live.weight);

  const isStuck = last && FT.detectStall(state, FT.SESSION_DOW[1], ex.id);
  const currentSetIdx = live.sets.findIndex(s => !s.done);

  return (
    <div style={{
      background: theme.surface,
      borderRadius: theme.radiusLg,
      border: `1px solid ${active ? theme.borderStrong : theme.border}`,
      boxShadow: active ? `0 0 0 1px ${theme.accent}30, ${theme.cardShadow}` : theme.cardShadow,
      transition: 'box-shadow .2s, border-color .2s',
      overflow: 'hidden',
    }}>
      <div onClick={onTap} style={{
        padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12,
        cursor: 'pointer',
      }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            {done && (
              <div style={{
                width: 18, height: 18, borderRadius: '50%', background: theme.success,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: theme.accentText, flexShrink: 0,
              }}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
            )}
            <div style={{ fontSize: 16, fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {ex.name}{ex.custom && <span style={{ color: theme.accent2, marginLeft: 6, fontSize: 11 }}>custom</span>}
            </div>
          </div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 3, fontFamily: theme.fontMono }}>
            {live.sets.filter(s => s.done).length}/{ex.sets} · Wdh {ex.reps} · Pause {ex.restRange}
          </div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 4, justifyContent: 'flex-end' }}>
            <div style={{ fontSize: 22, fontWeight: 800, fontFamily: theme.fontDisplay, color: theme.text }}>
              {FT.fmtWeight(live.weight)}
            </div>
            <span style={{ fontSize: 11, color: theme.muted }}>kg</span>
          </div>
          {change > 0 && <div style={{ fontSize: 10, color: theme.success, fontWeight: 700 }}>+{FT.fmtWeight(change)}↑</div>}
          {change < 0 && <div style={{ fontSize: 10, color: theme.danger, fontWeight: 700 }}>{FT.fmtWeight(change)}↓</div>}
        </div>
      </div>

      {active && !done && (
        <div style={{ borderTop: `1px solid ${theme.border}`, padding: '14px 16px' }}>

          {/* Stall hint → Deload suggestion */}
          {isStuck && (
            <div style={{
              padding: '10px 12px', marginBottom: 12,
              borderRadius: theme.radius, background: theme.accent2 + '15',
              border: `1px solid ${theme.accent2}40`,
              fontSize: 11, color: theme.text, lineHeight: 1.5,
            }}>
              <strong style={{ color: theme.accent2 }}>⚠ Festgefahren</strong> — 2 Sessions auf {FT.fmtWeight(live.weight)}kg.
              Versuch <strong>Deload</strong>: nimm diese Session −10% und arbeite dich nächste Woche wieder hoch.
              <div style={{ marginTop: 6 }}>
                <button onClick={() => onAdjustWeight(-Math.round(live.weight * 0.1 / 2.5) * 2.5)} style={{
                  padding: '6px 10px', borderRadius: theme.radius,
                  background: theme.accent2, color: theme.accentText, border: 'none',
                  fontSize: 11, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
                }}>Deload anwenden</button>
              </div>
            </div>
          )}

          {/* Weight adjust + plate + replace */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14, gap: 6 }}>
            <Label theme={theme}>Arbeitsgewicht</Label>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <StepBtn theme={theme} onClick={() => onAdjustWeight(-ex.increment)}>−{FT.fmtWeight(ex.increment)}</StepBtn>
              <StepBtn theme={theme} onClick={() => onAdjustWeight(ex.increment)}>+{FT.fmtWeight(ex.increment)}</StepBtn>
              {ex.type === 'compound' && (
                <button onClick={onOpenPlates} title="Plate Calc" style={{
                  width: 36, height: 32, borderRadius: theme.radius,
                  background: theme.surface2, border: `1px solid ${theme.border}`,
                  color: theme.text, fontSize: 14, cursor: 'pointer',
                  fontFamily: theme.fontMono, fontWeight: 700,
                }}>⏤⏤</button>
              )}
              <button onClick={onReplace} title="Übung ersetzen" style={{
                width: 32, height: 32, borderRadius: theme.radius,
                background: theme.surface2, border: `1px solid ${theme.border}`,
                color: theme.muted, fontSize: 16, cursor: 'pointer', lineHeight: 1,
              }}>⇄</button>
            </div>
          </div>

          {/* Warm-ups */}
          {warmups.length > 0 && (
            <div style={{ marginBottom: 14 }}>
              <Label theme={theme} style={{ marginBottom: 6 }}>
                Aufwärmen ({warmupStyle === 'wendler' ? 'Wendler-Style' : 'Standard'})
              </Label>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {warmups.map((w, i) => (
                  <div key={i} style={{
                    padding: '6px 10px', background: theme.surface2,
                    borderRadius: theme.radius, fontSize: 11, fontFamily: theme.fontMono,
                    color: theme.mutedStrong,
                  }}>
                    {FT.fmtWeight(w.w)}{typeof w.w === 'number' ? 'kg' : ''} × {w.r}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Set list with big "Satz fertig" button on current */}
          <Label theme={theme} style={{ marginBottom: 6 }}>Arbeitssätze</Label>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {live.sets.map((s, i) => (
              <SetRow key={i} theme={theme} idx={i} set={s} targetReps={ex.reps}
                isCurrent={i === currentSetIdx}
                rpeMode={state.settings.rpeMode}
                onStart={() => onStartSet(i)}
              />
            ))}
          </div>

          {/* Last session compact */}
          {last && (
            <div style={{ marginTop: 12, padding: '8px 10px', borderRadius: theme.radius, background: theme.surface2 }}>
              <span style={{ fontSize: 10, color: theme.muted, fontFamily: theme.fontMono, letterSpacing: 1, textTransform: 'uppercase' }}>
                zuletzt {FT.daysAgo(last.date)} · {FT.fmtWeight(last.weight)}kg
              </span>
              <span style={{ marginLeft: 8, fontFamily: theme.fontMono, fontSize: 11, color: theme.mutedStrong }}>
                {last.sets.map(s => s.reps + (s.rpe ? `@${s.rpe}` : '')).join(' · ')}
              </span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function StepBtn({ theme, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      minWidth: 52, height: 32, padding: '0 8px', borderRadius: theme.radius,
      background: theme.surface2, border: `1px solid ${theme.border}`,
      color: theme.text, fontWeight: 700, fontSize: 12, fontFamily: theme.fontMono,
      cursor: 'pointer',
    }}>{children}</button>
  );
}

// ─────────────────────────────────────────────────────────────
// SET ROW — collapsed: ✓/○ summary; current: BIG "Satz fertig" button
// ─────────────────────────────────────────────────────────────
function SetRow({ theme, idx, set, targetReps, isCurrent, rpeMode, onStart }) {
  if (set.done) {
    return (
      <div style={{
        padding: '10px 12px', borderRadius: theme.radius,
        background: theme.surface2, opacity: 0.8,
        display: 'flex', alignItems: 'center', gap: 10,
      }}>
        <div style={{
          width: 20, height: 20, borderRadius: '50%', background: theme.success,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={theme.accentText} strokeWidth="3.5"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div style={{ fontSize: 13, fontWeight: 700 }}>Satz {idx + 1}</div>
        <div style={{ flex: 1, fontFamily: theme.fontMono, fontSize: 12, color: theme.mutedStrong }}>
          {set.reps} Wdh · {rpeMode === 'rir' && set.rpe ? `RIR ${FT.rpeToRir(set.rpe)}` : (set.rpe ? `RPE ${set.rpe}` : '')}
        </div>
        {set.form && set.form !== 'sauber' && (
          <span style={{ fontSize: 10, color: theme.accent2, fontFamily: theme.fontMono, textTransform: 'uppercase', letterSpacing: 0.5 }}>
            {set.form}
          </span>
        )}
        {set.note && <span style={{ fontSize: 11, color: theme.muted }} title={set.note}>✎</span>}
      </div>
    );
  }

  if (isCurrent) {
    return (
      <button onClick={onStart} style={{
        padding: '18px 16px', borderRadius: theme.radiusLg,
        background: theme.accent, color: theme.accentText,
        border: 'none', cursor: 'pointer', fontFamily: 'inherit',
        display: 'flex', alignItems: 'center', gap: 12,
        boxShadow: `0 8px 24px -8px ${theme.accent}80`,
        animation: 'pulse 2s ease-in-out infinite',
      }}>
        <div style={{
          width: 28, height: 28, borderRadius: '50%',
          background: 'rgba(0,0,0,0.15)', display: 'flex',
          alignItems: 'center', justifyContent: 'center',
          fontWeight: 800, fontSize: 14, fontFamily: theme.fontDisplay,
        }}>{idx + 1}</div>
        <div style={{ flex: 1, textAlign: 'left' }}>
          <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: theme.upperHeads ? 0.5 : 0,
            textTransform: theme.upperHeads ? 'uppercase' : 'none' }}>
            Satz fertig
          </div>
          <div style={{ fontSize: 11, opacity: 0.75, marginTop: 2 }}>
            Ziel {targetReps} Wdh · Pause startet sofort
          </div>
        </div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </button>
    );
  }

  // Future set — just placeholder
  return (
    <div style={{
      padding: '10px 12px', borderRadius: theme.radius,
      background: 'transparent', border: `1px dashed ${theme.border}`,
      display: 'flex', alignItems: 'center', gap: 10, opacity: 0.5,
    }}>
      <div style={{ width: 20, height: 20, borderRadius: '50%', border: `2px solid ${theme.border}` }} />
      <div style={{ fontSize: 13, fontWeight: 700 }}>Satz {idx + 1}</div>
      <div style={{ flex: 1, fontFamily: theme.fontMono, fontSize: 12, color: theme.muted }}>
        Ziel {targetReps} Wdh
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// REPLACE PICKER — pick a custom exercise to swap in
// ─────────────────────────────────────────────────────────────
function ReplacePicker({ theme, state, ex, onPick, onClose }) {
  const customs = state.customExercises || [];

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100,
      background: 'rgba(0,0,0,0.75)', backdropFilter: 'blur(8px)',
      WebkitBackdropFilter: 'blur(8px)',
      display: 'flex', flexDirection: 'column',
      animation: 'fadeIn .2s',
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        marginTop: 'auto', padding: 22, paddingBottom: 36,
        background: theme.surface, borderRadius: `${theme.radiusXl}px ${theme.radiusXl}px 0 0`,
        borderTop: `1px solid ${theme.borderStrong}`,
      }}>
        <div style={{ width: 40, height: 4, background: theme.border, borderRadius: 2, margin: '0 auto 18px' }} />

        <Heading theme={theme} size="md">{ex.name} ersetzen</Heading>
        <div style={{ height: 14 }} />

        {customs.length === 0 ? (
          <div style={{
            padding: 16, borderRadius: theme.radius,
            background: theme.surface2, fontSize: 12, color: theme.muted, textAlign: 'center',
          }}>
            Keine eigenen Übungen.<br />Erstelle welche im Coach → ➕ Übungen.
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {customs.map(c => (
              <button key={c.id} onClick={() => onPick(c.id)} style={{
                padding: '12px 14px', borderRadius: theme.radius,
                background: theme.surface2, border: `1px solid ${theme.border}`,
                color: theme.text, textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{c.name}</div>
                  <div style={{ fontSize: 11, color: theme.muted, fontFamily: theme.fontMono, marginTop: 2 }}>
                    {c.sets}×{c.reps} · {c.weight}kg
                  </div>
                </div>
                <span style={{ color: theme.accent, fontSize: 14 }}>→</span>
              </button>
            ))}
            <button onClick={() => onPick(null)} style={{
              marginTop: 6, padding: '10px 14px', borderRadius: theme.radius,
              background: 'transparent', border: `1px solid ${theme.danger}40`,
              color: theme.danger, cursor: 'pointer', fontFamily: 'inherit',
              fontSize: 12,
            }}>Zurück zur Plan-Übung</button>
          </div>
        )}
      </div>
    </div>
  );
}

window.ExerciseCard = ExerciseCard;
window.SetRow = SetRow;
window.ReplacePicker = ReplacePicker;

  </script>
  <script type="text/babel">
/* global React, FT */
// app-workout-rest.jsx — Rest timer overlay + RPE/RIR helpers
//
// The pause-first heart of the workout: a circular timer that fills,
// inline reps/RPE/form/note logging during the rest, and audio feedback
// when the rest ends. Companion to app-workout.jsx.

const { useState: useStateRT, useEffect: useEffectRT, useRef: useRefRT } = React;

// ─────────────────────────────────────────────────────────────
// REST TIMER OVERLAY — pause + inline data entry
// ─────────────────────────────────────────────────────────────
function RestTimerOverlay({ theme, state, exercise, setIdx, weight, set, nextLabel, duration, onUpdateSet, onClose, onOpenPlates }) {
  const [extra, setExtra] = useStateRT(0);
  const [now, setNow] = useStateRT(Date.now());
  const startedRef = useRefRT(Date.now());
  const bellPlayedRef = useRefRT(false);

  useEffectRT(() => {
    const id = setInterval(() => setNow(Date.now()), 100);
    return () => clearInterval(id);
  }, []);

  const elapsed = (now - startedRef.current) / 1000;
  const total = duration + extra;
  const remaining = Math.max(0, total - elapsed);
  const pct = Math.max(0, Math.min(1, elapsed / total));

  useEffectRT(() => {
    if (remaining <= 0 && !bellPlayedRef.current) {
      bellPlayedRef.current = true;
      FT.playSound(state.settings.soundKind, state.settings);
    }
  }, [remaining, state.settings]);

  const r = 100, cx = 120, cy = 120, circ = 2 * Math.PI * r;
  const dashOffset = circ * (1 - pct);
  const overdue = remaining <= 0;

  const rpeMode = state.settings.rpeMode;

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100,
      background: 'rgba(0,0,0,0.88)', backdropFilter: 'blur(12px)',
      WebkitBackdropFilter: 'blur(12px)',
      display: 'flex', flexDirection: 'column',
      paddingTop: 60, paddingBottom: 20,
      overflowY: 'auto',
      animation: 'fadeIn .2s',
    }}>
      {/* Timer (top, compact) */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '0 22px 14px' }}>
        <Label theme={theme}>Pause · {exercise.name} · Satz {setIdx + 1}</Label>
        <div style={{ height: 8 }} />
        <div style={{ position: 'relative', width: 240, height: 240 }}>
          <svg width="240" height="240" viewBox="0 0 240 240">
            <circle cx={cx} cy={cy} r={r} fill="none" stroke={theme.surface2} strokeWidth="12" />
            <circle cx={cx} cy={cy} r={r} fill="none"
              stroke={overdue ? theme.success : theme.accent} strokeWidth="12"
              strokeLinecap="round" strokeDasharray={circ}
              strokeDashoffset={dashOffset}
              transform={`rotate(-90 ${cx} ${cy})`}
              style={{ transition: 'stroke-dashoffset .3s linear, stroke .3s' }} />
          </svg>
          <div style={{
            position: 'absolute', inset: 0, display: 'flex',
            flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
          }}>
            <div style={{
              fontSize: 56, fontWeight: 800, fontFamily: theme.fontDisplay,
              color: overdue ? theme.success : theme.text,
              fontVariantNumeric: 'tabular-nums', letterSpacing: -1,
            }}>
              {overdue ? 'GO!' : FT.fmtTime(remaining)}
            </div>
            {!overdue && (
              <div style={{ fontSize: 11, color: theme.muted, fontFamily: theme.fontMono, marginTop: -2 }}>
                von {FT.fmtTime(total)}
              </div>
            )}
          </div>
        </div>
        <div style={{ marginTop: 8, fontSize: 12, color: theme.muted, fontFamily: theme.fontMono }}>
          Als Nächstes: <strong style={{ color: theme.mutedStrong }}>{nextLabel}</strong>
        </div>
      </div>

      {/* LOG SECTION — entered DURING the pause */}
      <div style={{ padding: '0 22px 14px' }}>
        <div style={{
          padding: 14, borderRadius: theme.radiusLg,
          background: theme.surface, border: `1px solid ${theme.borderStrong}`,
        }}>
          <Label theme={theme} style={{ marginBottom: 10 }}>Diesen Satz protokollieren</Label>

          {/* Reps + Plate */}
          <div style={{ display: 'flex', gap: 10, marginBottom: 10 }}>
            <div style={{ flex: 1 }}>
              <Label theme={theme} style={{ marginBottom: 4 }}>Wdh</Label>
              <Stepper theme={theme} value={set.reps ?? exercise.reps}
                onChange={v => onUpdateSet({ reps: v })} />
            </div>
            <div style={{ flex: 1 }}>
              <Label theme={theme} style={{ marginBottom: 4 }}>Gewicht</Label>
              <div style={{
                padding: '8px 10px', borderRadius: theme.radius,
                background: theme.bg, border: `1px solid ${theme.border}`,
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              }}>
                <span style={{ fontSize: 18, fontWeight: 800, fontFamily: theme.fontDisplay }}>
                  {FT.fmtWeight(weight)}<span style={{ fontSize: 10, color: theme.muted, marginLeft: 2 }}>kg</span>
                </span>
                {exercise.type === 'compound' && (
                  <button onClick={onOpenPlates} style={{
                    background: theme.surface2, border: `1px solid ${theme.border}`,
                    color: theme.muted, padding: '4px 8px', borderRadius: 4,
                    fontSize: 10, cursor: 'pointer', fontFamily: theme.fontMono,
                  }}>Plates</button>
                )}
              </div>
            </div>
          </div>

          {/* RPE / RIR */}
          <Label theme={theme} style={{ marginBottom: 6 }}>
            {rpeMode === 'rir' ? 'RIR — Reps in Reserve' : 'RPE — wie schwer war\'s?'}
          </Label>
          {rpeMode === 'rir' ? (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 4, marginBottom: 10 }}>
              {[4, 3, 2, 1, 0].map(rir => {
                const rpe = FT.rirToRpe(rir);
                const active = set.rpe === rpe;
                return (
                  <button key={rir} onClick={() => onUpdateSet({ rpe })} style={rpeBtnStyle(theme, active, rir <= 1)}>
                    {rir}
                  </button>
                );
              })}
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 4, marginBottom: 10 }}>
              {[5, 6, 7, 8, 9, 10].map(n => {
                const active = set.rpe === n;
                return (
                  <button key={n} onClick={() => onUpdateSet({ rpe: n })} style={rpeBtnStyle(theme, active, n >= 9)}>
                    {n}
                  </button>
                );
              })}
            </div>
          )}
          <div style={{ fontSize: 10.5, color: theme.muted, fontFamily: theme.fontMono, marginBottom: 10, lineHeight: 1.5 }}>
            {set.rpe ? (rpeMode === 'rir' ? rirDescription(FT.rpeToRir(set.rpe)) : rpeDescription(set.rpe)) : 'Tap einen Wert'}
          </div>

          {/* Form-Tag */}
          <Label theme={theme} style={{ marginBottom: 6 }}>Form</Label>
          <div style={{ display: 'flex', gap: 4, marginBottom: 10 }}>
            {[
              { v: 'sauber',   label: '✓ Sauber',  c: theme.success },
              { v: 'wacklig',  label: '~ Wacklig', c: theme.accent2 },
              { v: 'spotter',  label: '! Spotter', c: theme.danger },
            ].map(o => (
              <button key={o.v} onClick={() => onUpdateSet({ form: o.v })} style={{
                flex: 1, padding: '8px 6px', borderRadius: theme.radius,
                background: set.form === o.v ? o.c + '20' : 'transparent',
                color: set.form === o.v ? o.c : theme.muted,
                border: `1px solid ${set.form === o.v ? o.c + '60' : theme.border}`,
                fontSize: 11, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
              }}>{o.label}</button>
            ))}
          </div>

          {/* Note */}
          <input value={set.note || ''} onChange={e => onUpdateSet({ note: e.target.value })}
            placeholder="Notiz (optional)"
            style={{
              width: '100%', boxSizing: 'border-box',
              padding: '10px 12px', borderRadius: theme.radius,
              background: theme.bg, border: `1px solid ${theme.border}`,
              color: theme.text, fontSize: 12, fontFamily: 'inherit', outline: 'none',
            }} />
        </div>
      </div>

      {/* Controls + close */}
      <div style={{ padding: '0 22px', display: 'flex', gap: 8, marginBottom: 10 }}>
        <RestCtl theme={theme} onClick={() => setExtra(extra - 15)}>−15 s</RestCtl>
        <RestCtl theme={theme} onClick={() => setExtra(extra + 30)}>+30 s</RestCtl>
        <RestCtl theme={theme} onClick={() => { startedRef.current = Date.now() - total * 1000; bellPlayedRef.current = true; }}>Skip</RestCtl>
      </div>
      <div style={{ padding: '0 22px' }}>
        <Btn theme={theme} kind={overdue ? 'primary' : 'secondary'} full onClick={onClose}>
          {overdue ? 'Weiter →' : 'Fertig & weiter'}
        </Btn>
      </div>
    </div>
  );
}

function rpeBtnStyle(theme, active, hard) {
  const c = hard ? theme.danger : theme.accent;
  return {
    padding: '12px 0', borderRadius: theme.radius,
    background: active ? c : theme.bg,
    color: active ? theme.accentText : theme.text,
    border: `1px solid ${active ? c : theme.border}`,
    fontSize: 14, fontWeight: 700, fontFamily: theme.fontDisplay,
    cursor: 'pointer',
  };
}

function rpeDescription(n) {
  return ({
    5: 'sehr leicht · 5+ in Reserve',
    6: 'leicht · 4 in Reserve',
    7: 'moderat · 3 in Reserve',
    8: 'schwer · 2 in Reserve  ◀ Ziel',
    9: 'sehr schwer · 1 in Reserve',
    10: 'maximal · keine Reserve',
  })[n] || '';
}

function rirDescription(rir) {
  return ({
    0: 'maximal · keine Reserve',
    1: 'sehr schwer · 1 in Reserve',
    2: 'schwer · 2 in Reserve  ◀ Ziel',
    3: 'moderat · 3 in Reserve',
    4: 'leicht · 4+ in Reserve',
  })[rir] || '';
}

function Stepper({ theme, value, onChange }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      background: theme.bg, borderRadius: theme.radius,
      border: `1px solid ${theme.border}`, padding: '4px 6px',
    }}>

  return (
    <div style={{

      <div style={{ display: 'flex', gap: 16, marginTop: 8 }}>
        <Mini theme={theme} label="Aktuell" v={`${FT.fmtWeight(last.weight)}kg`} />
        <Mini theme={theme} label="Best" v={`${FT.fmtWeight(best?.weight || 0)}kg`} />
        <Mini theme={theme} label="1RM est." v={oneRM ? `${Math.round(oneRM)}kg` : '—'} />

  );
