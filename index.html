function Mini({ theme, label, v }) {
  return (
    <div>
      <div style={{ fontSize: 9.5, color: theme.muted, letterSpacing: 1, textTransform: 'uppercase', fontFamily: theme.fontMono, marginBottom: 2 }}>{label}</div>
      <div style={{ fontSize: 13, fontWeight: 700, fontFamily: theme.fontDisplay }}>{v}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// MINI CHART — simple sparkline
// ─────────────────────────────────────────────────────────────
function MiniChart({ theme, data, color, unit }) {
  if (!data || data.length === 0) return null;
  if (data.length === 1) {
    return (
      <div style={{ fontSize: 12, color: theme.muted, fontFamily: theme.fontMono, padding: '14px 0' }}>
        {FT.fmtWeight(data[0].y)}{unit} (nur ein Datenpunkt)
      </div>
    );
  }
  const w = 320, h = 60, pad = 6;
  const ys = data.map(d => d.y);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yRange = Math.max(1, yMax - yMin);
  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.y - yMin) / yRange) * (h - pad * 2);
    return [x, y];
  });
  const path = 'M ' + points.map(p => p.join(',')).join(' L ');
  const area = path + ` L ${points[points.length - 1][0]},${h} L ${points[0][0]},${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: 60, display: 'block' }}>
      <defs>
        <linearGradient id={`g-${color}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#g-${color})`} />
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r="2.5" fill={color} />
      ))}
    </svg>
  );
}

window.MiniChart = MiniChart;

// PLATE CALCULATOR OVERLAY

function countPlates(plates) {
  const m = {};
  plates.forEach(p => { m[p] = (m[p] || 0) + 1; });
  return Object.entries(m)
    .map(([w, c]) => ({ weight: parseFloat(w), count: c }))
    .sort((a, b) => b.weight - a.weight);
}

// Visual: bar + plates stacked from inside out, mirrored
function BarbellVisual({ theme, plates }) {
  const colors = FT.PLATE_COLORS;

        ))}

}

window.PlateCalculator = PlateCalculator;

const { useState: useStateR, useEffect: useEffectR } = React;

function RecoveryCheck({ theme, sessionName, onContinue, onSkip }) {
  const [sleep, setSleep] = useStateR(3);

function RecoveryRow({ theme, icon, label, sub, value, onChange }) {

// ─────────────────────────────────────────────────────────────
// PR CELEBRATION — overlay that briefly shows when a PR was hit
// ─────────────────────────────────────────────────────────────
function PRCelebration({ theme, prs, onDismiss }) {
  // Auto-dismiss after a moment
  useEffectR(() => {
    const id = setTimeout(onDismiss, 6500);
    return () => clearTimeout(id);
  }, [onDismiss]);

  if (!prs || !prs.length) return null;

  // Build a couple confetti pieces (CSS animation)
  const confetti = Array.from({ length: 28 }, (_, i) => ({
    id: i,
    left: 5 + Math.random() * 90,
    delay: Math.random() * 0.5,
    duration: 1.6 + Math.random() * 1.2,
    color: [theme.accent, theme.accent2 || theme.success, theme.success, '#FFFFFF'][i % 4],
    size: 6 + Math.random() * 8,
    rot: Math.random() * 360,
  }));

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 200,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(12px)',

      overflow: 'hidden', cursor: 'pointer', animation: 'fadeIn .25s',
    }} onClick={onDismiss}>
      <style>{`
        @keyframes confettiFall {
          0% { transform: translateY(-100px) rotate(var(--r,0deg)); opacity: 1; }
          80% { opacity: 1; }
          100% { transform: translateY(900px) rotate(calc(var(--r,0deg) + 720deg)); opacity: 0; }
        }
      `}</style>
      {confetti.map(c => (
        <div key={c.id} style={{
          position: 'absolute', top: 0, left: `${c.left}%`,
          width: c.size, height: c.size * 0.4,
          background: c.color, borderRadius: 2,
          '--r': `${c.rot}deg`,
          animation: `confettiFall ${c.duration}s ease-in ${c.delay}s forwards`,
        }} />
      ))}
      <div style={{ textAlign: 'center', padding: 30, position: 'relative' }}>
        <div style={{ fontSize: 72, lineHeight: 1 }}>🏆</div>
        <div style={{
          marginTop: 14, fontSize: 36, fontWeight: 800,
          fontFamily: theme.fontDisplay, color: theme.accent,
          letterSpacing: theme.upperHeads ? 1 : -0.5,
          textTransform: theme.upperHeads ? 'uppercase' : 'none',
        }}>
          Neuer PR{prs.length > 1 ? 's' : ''}!
        </div>
        <div style={{ height: 18 }} />
        {prs.map(pr => (
          <div key={pr.id} style={{
            margin: '0 auto 10px', padding: '12px 18px', maxWidth: 280,
            borderRadius: theme.radius, background: theme.surface,
            border: `1px solid ${theme.accent}60`,
          }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: theme.text }}>
              {pr.name}
            </div>
            <div style={{ marginTop: 4, fontSize: 13, color: theme.muted, fontFamily: theme.fontMono }}>
              {FT.fmtWeight(pr.weight)}kg × {pr.reps} · 1RM est. <span style={{ color: theme.success }}>{pr.est}kg</span>
            </div>
          </div>
        ))}
        <div style={{ marginTop: 12, fontSize: 11, color: theme.muted }}>
          Tap zum Schließen
        </div>
      </div>
    </div>
  );
}

window.RecoveryCheck = RecoveryCheck;
window.PRCelebration = PRCelebration;

/* global React, FT */
// app-coach.jsx — Coach screen: Claude feedback, Form-Cues, Custom Übungen, Replace

const { useState: useStateC, useEffect: useEffectC } = React;

function CoachScreen({ theme, state, setState, onClose }) {
  const [tab, setTab] = useStateC('feedback'); // feedback | cues | custom

  return (
    <div style={{ height: '100%', overflowY: 'auto', WebkitOverflowScrolling: 'touch', paddingTop: theme.padTop || 56, paddingBottom: `calc(30px + ${theme.padBot || '0px'})` }}>
      <div style={{ padding: '12px 22px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <button onClick={onClose} style={{
          background: 'transparent', border: 'none', color: theme.muted,
          fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6,
          fontFamily: 'inherit', padding: 0,
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Zurück
        </button>
        <Pill theme={theme} fill>Coach</Pill>
      </div>

      <div style={{ padding: '0 22px 14px' }}>
        <Heading theme={theme} size="xl" style={{ color: theme.text }}>Coach</Heading>
      </div>

      {/* Tabs */}
      <div style={{ padding: '0 22px 14px', display: 'flex', gap: 4 }}>
        {[
          { id: 'feedback', label: '🤖 Feedback' },
          { id: 'cues',     label: '🎯 Form' },
          { id: 'custom',   label: '➕ Übungen' },
        ].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            flex: 1, padding: '10px 0', borderRadius: theme.radius,
            background: tab === t.id ? theme.surface : 'transparent',
            color: tab === t.id ? theme.text : theme.muted,
            border: `1px solid ${tab === t.id ? theme.borderStrong : 'transparent'}`,
            fontSize: 12, fontWeight: 700, fontFamily: 'inherit', cursor: 'pointer',
          }}>{t.label}</button>
        ))}
      </div>

      {tab === 'feedback' && <FeedbackTab theme={theme} state={state} />}
      {tab === 'cues'     && <CuesTab     theme={theme} />}
      {tab === 'custom'   && <CustomTab   theme={theme} state={state} setState={setState} />}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// FEEDBACK TAB — Claude-powered weekly analysis
// ─────────────────────────────────────────────────────────────
function FeedbackTab({ theme, state }) {
  const [loading, setLoading] = useStateC(false);
  const [response, setResponse] = useStateC('');
  const [error, setError] = useStateC('');

  async function generate() {
    setLoading(true); setError(''); setResponse('');
    const recent = state.sessions.slice(-6);
    if (!recent.length) {
      setError('Noch keine Sessions. Trainier ein paar Mal — dann kann der Coach was sagen.');
      setLoading(false);
      return;
    }
    const summary = recent.map(s => {
      const exes = (s.exercises || []).map(e => {
        const reps = (e.sets || []).map(st => `${st.reps}@RPE${st.rpe || '-'}`).join('/');
        return `${e.name}: ${e.weight}kg ${reps}`;
      }).join('; ');
      return `${s.date} [${s.sessionId}] feel=${s.feel || '-'}/5: ${exes}`;
    }).join('\n');

    const prompt = `Du bist ein erfahrener, lockerer Krafttrainer.
Hier sind die letzten Trainingseinheiten:

${summary}

Aktuelles Bodyweight: ${state.bodyweight[state.bodyweight.length - 1]?.kg ?? 'unbekannt'} kg
Woche im Plan: ${state.weekNo}
Trainingsplan: Restart-Phase Linear Progression, 3× / Woche (Mo/Mi/Fr).

Gib mir in 4-5 kurzen Absätzen lockeres, ehrliches Feedback auf Deutsch:
- Was läuft gut?
- Wo steckt's fest und warum?
- 1-2 konkrete Vorschläge für nächste Woche
- Ein motivierender Abschluss-Satz

Keine generischen Phrasen. Konkret und kurz.`;

    try {
      const text = await window.claude.complete(prompt);
      setResponse(text || 'Coach hat nix gesagt 🤷');
    } catch (e) {
      setError("Coach ist gerade nicht erreichbar. Versuch's gleich nochmal.");
      console.error(e);
    } finally { setLoading(false); }
  }

  return (
    <div style={{ padding: '0 22px' }}>
      <Card theme={theme} style={{ padding: 16 }}>
        <Label theme={theme}>KI-Coach</Label>
        <div style={{ marginTop: 6, fontSize: 13, color: theme.mutedStrong, lineHeight: 1.5 }}>
          Hol dir ein lockeres Feedback zu deinen letzten 6 Sessions —
          was läuft, wo's stockt, was du nächste Woche probieren solltest.
        </div>
        <div style={{ height: 14 }} />
        <Btn theme={theme} kind="primary" full onClick={generate} disabled={loading}>
          {loading ? '⏳ Coach denkt nach …' : '🤖 Feedback generieren'}
        </Btn>
      </Card>

      {error && (
        <div style={{
          marginTop: 12, padding: 14, borderRadius: theme.radius,
          background: theme.danger + '15', color: theme.danger,
          border: `1px solid ${theme.danger}40`, fontSize: 12,
        }}>{error}</div>
      )}

      {response && (
        <div style={{
          marginTop: 14, padding: 18, borderRadius: theme.radiusLg,
          background: theme.surface, border: `1px solid ${theme.border}`,
          fontSize: 13.5, lineHeight: 1.7, color: theme.text, whiteSpace: 'pre-wrap',
        }}>{response}</div>
      )}

      <div style={{
        marginTop: 14, padding: 12, borderRadius: theme.radius,
        background: theme.surface2, fontSize: 10, color: theme.muted,
        fontFamily: theme.fontMono, lineHeight: 1.5,
      }}>
        ℹ️ Coach-Antworten basieren auf einem KI-Modell.
        Bei Verletzungen / Schmerzen immer mit echtem Arzt / Physio reden.
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// CUES TAB — form cues for each plan exercise
// ─────────────────────────────────────────────────────────────
function CuesTab({ theme }) {
  const allEx = [];
  Object.values(FT.TRAINING_PLAN).forEach(sess => {
    sess.exercises.forEach(ex => {
      if (!allEx.find(x => x.id === ex.id)) allEx.push(ex);
    });
  });

  const [open, setOpen] = useStateC(allEx[0]?.id);

  return (
    <div style={{ padding: '0 22px', display: 'flex', flexDirection: 'column', gap: 8 }}>
      {allEx.map(ex => {
        const cues = FT.getCues(ex.id);
        if (!cues) return null;
        const isOpen = open === ex.id;
        return (
          <div key={ex.id} style={{
            background: theme.surface, borderRadius: theme.radius,
            border: `1px solid ${isOpen ? theme.borderStrong : theme.border}`,
            overflow: 'hidden',
          }}>
            <button onClick={() => setOpen(isOpen ? null : ex.id)} style={{
              width: '100%', padding: '14px 16px',
              background: 'transparent', border: 'none', color: theme.text,
              fontFamily: 'inherit', fontSize: 14, fontWeight: 700,
              cursor: 'pointer', textAlign: 'left',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            }}>
              <span>{ex.name}</span>
              <span style={{ color: theme.muted, fontSize: 18, lineHeight: 1 }}>{isOpen ? '−' : '+'}</span>
            </button>
            {isOpen && (
              <div style={{ padding: '0 16px 16px', borderTop: `1px solid ${theme.border}`, paddingTop: 12 }}>
                <Label theme={theme} style={{ marginBottom: 6 }}>Setup</Label>
                <div style={{ fontSize: 13, color: theme.mutedStrong, lineHeight: 1.6, marginBottom: 12 }}>
                  {cues.setup}
                </div>
                <Label theme={theme} style={{ marginBottom: 6 }}>Cues</Label>
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13, color: theme.mutedStrong, lineHeight: 1.7, marginBottom: 12 }}>
                  {cues.cues.map((c, i) => <li key={i}>{c}</li>)}
                </ul>
                <Label theme={theme} style={{ marginBottom: 6, color: theme.danger }}>Häufige Fehler</Label>
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13, color: theme.mutedStrong, lineHeight: 1.7 }}>
                  {cues.mistakes.map((m, i) => <li key={i}>{m}</li>)}
                </ul>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// CUSTOM TAB — add custom exercises, manage replacements
// ─────────────────────────────────────────────────────────────
function CustomTab({ theme, state, setState }) {
  const customs = state.customExercises || [];
  const [adding, setAdding] = useStateC(false);

  function addCustom(ex) {
    setState(s => ({
      ...s, customExercises: [...(s.customExercises || []), ex]
    }));
    setAdding(false);
  }

  function deleteCustom(id) {
    setState(s => ({
      ...s,
      customExercises: (s.customExercises || []).filter(c => c.id !== id),
      replacements: Object.fromEntries(Object.entries(s.replacements || {}).filter(([, v]) => v !== id)),
    }));
  }

  return (
    <div style={{ padding: '0 22px' }}>
      {adding && <CustomForm theme={theme} onAdd={addCustom} onCancel={() => setAdding(false)} />}

      {!adding && (
        <>
          <div style={{ marginBottom: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <Label theme={theme}>Eigene Übungen ({customs.length})</Label>
            <button onClick={() => setAdding(true)} style={{
              padding: '8px 12px', borderRadius: theme.radius,
              background: theme.accent, color: theme.accentText,
              border: 'none', fontWeight: 700, fontSize: 12,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>+ Neue Übung</button>
          </div>

          {customs.length === 0 ? (
            <div style={{
              padding: 18, borderRadius: theme.radius,
              background: theme.surface, border: `1px dashed ${theme.border}`,
              fontSize: 12, color: theme.muted, textAlign: 'center',
            }}>
              Noch keine eigenen Übungen.<br />
              Tippe „+ Neue Übung" — z.B. Klimmzüge, Dips, Hammer Curls.
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {customs.map(c => (
                <div key={c.id} style={{
                  padding: 14, borderRadius: theme.radius,
                  background: theme.surface, border: `1px solid ${theme.border}`,
                }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>{c.name}</div>
                      <div style={{ fontSize: 11, color: theme.muted, fontFamily: theme.fontMono, marginTop: 2 }}>
                        {c.sets}×{c.reps} · {c.weight}kg · Pause {c.restRange} · +{c.increment}kg
                      </div>
                    </div>
                    <button onClick={() => deleteCustom(c.id)} style={{
                      background: 'transparent', border: 'none', color: theme.danger,
                      fontSize: 11, cursor: 'pointer', fontFamily: 'inherit',
                    }}>Löschen</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Replacements info */}
          <div style={{
            marginTop: 18, padding: 12, borderRadius: theme.radius,
            background: theme.surface2, fontSize: 11, color: theme.muted, lineHeight: 1.6,
          }}>
            <strong style={{ color: theme.mutedStrong }}>Ersetzen:</strong> Im Workout-Screen kannst du eine
            Plan-Übung durch eine eigene austauschen (z.B. wenn die Bank besetzt ist).
          </div>
        </>
      )}
    </div>
  );
}

function CustomForm({ theme, onAdd, onCancel }) {
  const [name, setName] = useStateC('');
  const [sets, setSets] = useStateC(3);
  const [reps, setReps] = useStateC(10);
  const [weight, setWeight] = useStateC(20);
  const [rest, setRest] = useStateC(90);
  const [type, setType] = useStateC('compound');

  function submit() {
    if (!name.trim()) return;
    onAdd({
      id: 'c_' + Date.now(),
      name: name.trim(),
      warmups: [],
      sets, reps, weight,
      rest, restRange: rest < 90 ? `${rest}s` : `${Math.round(rest / 60)} min`,
      type, increment: type === 'isolation' ? 1.25 : 2.5, bar: type === 'compound' ? 20 : 0,
      custom: true,
    });
  }

  return (
    <div style={{
      padding: 14, borderRadius: theme.radius,
      background: theme.surface, border: `1px solid ${theme.borderStrong}`,
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <div style={{ fontSize: 14, fontWeight: 700 }}>Neue Übung</div>
        <button onClick={onCancel} style={{
          background: 'transparent', border: 'none', color: theme.muted,
          fontSize: 11, cursor: 'pointer', fontFamily: 'inherit',
        }}>Abbrechen</button>
      </div>

      <Label theme={theme} style={{ marginBottom: 4 }}>Name</Label>
      <input value={name} onChange={e => setName(e.target.value)}
        placeholder="z.B. Klimmzüge"
        style={inputStyle(theme)} />

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginTop: 10 }}>
        <NumField theme={theme} label="Sätze" value={sets} onChange={setSets} />
        <NumField theme={theme} label="Wdh"   value={reps} onChange={setReps} />
        <NumField theme={theme} label="Gewicht" value={weight} onChange={setWeight} step={2.5} unit="kg" />
      </div>

      <div style={{ marginTop: 10 }}>
        <Label theme={theme} style={{ marginBottom: 4 }}>Typ</Label>
        <div style={{ display: 'flex', gap: 6 }}>
          {[['compound', 'Compound +2.5kg'], ['isolation', 'Isolation +1.25kg']].map(([k, l]) => (
            <button key={k} onClick={() => setType(k)} style={{
              flex: 1, padding: '10px 8px', borderRadius: theme.radius,
              background: type === k ? theme.accent : theme.surface2,
              color: type === k ? theme.accentText : theme.text,
              border: `1px solid ${type === k ? theme.accent : theme.border}`,
              fontSize: 11, fontWeight: 700, fontFamily: 'inherit',
              cursor: 'pointer',
            }}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 10 }}>
        <Label theme={theme} style={{ marginBottom: 4 }}>Pause (Sekunden)</Label>
        <input type="number" value={rest} onChange={e => setRest(parseInt(e.target.value) || 60)}
          style={inputStyle(theme)} />
      </div>

      <div style={{ height: 14 }} />
      <Btn theme={theme} kind="primary" full onClick={submit} disabled={!name.trim()}>
        ✓ Hinzufügen
      </Btn>
    </div>
  );
}

function NumField({ theme, label, value, onChange, step = 1, unit }) {
  return (
    <div>
      <Label theme={theme} style={{ marginBottom: 4 }}>{label}{unit ? ` (${unit})` : ''}</Label>
      <input type="number" step={step} value={value}
        onChange={e => onChange(parseFloat(e.target.value) || 0)}
        style={inputStyle(theme)} />
    </div>
  );
}

function inputStyle(theme) {
  return {
    width: '100%', boxSizing: 'border-box',
    padding: '10px 12px', borderRadius: theme.radius,
    background: theme.bg, border: `1px solid ${theme.border}`,
    color: theme.text, fontSize: 13, fontFamily: 'inherit', outline: 'none',
  };
}

window.CoachScreen = CoachScreen;

  </script>
  <script type="text/babel">
/* global React, ReactDOM, FT, THEMES */
// app-main.jsx — top-level App with all screens + flows wired up

const { useState: useStateM, useEffect: useEffectM } = React;

function App({ theme }) {
  const [state, setState] = useAppState(theme);
  const [screen, setScreen] = useStateM('home'); // home | preCheck | workout | stats | settings | coach
  const [plateModal, setPlateModal] = useStateM(null);

  const sessionId = FT.suggestSessionToday(state);

  function startWorkout() {
    setScreen('preCheck');
  }

  function continueFromRecovery(recovery) {
    setPendingRecovery(recovery);
    setScreen('workout');
  }

  function skipRecovery() {
    setPendingRecovery(null);
    setScreen('workout');
  }

  return (
    <Frame theme={theme}>
      {screen === 'home' && (

          onOpenStats={() => setScreen('stats')}

          onOpenCoach={() => setScreen('coach')}
          onOpenPlates={() => setPlateModal({ target: 60, bar: state.settings.barWeight })}
        />
      )}
      {screen === 'preCheck' && (
        <>
          <HomeScreen theme={theme} state={state} setState={setState}
            onStart={() => {}}
            onOpenStats={() => {}}
            onOpenSettings={() => {}}
            onOpenCoach={() => {}}
            onOpenPlates={() => {}}
          />
          <RecoveryCheck theme={theme}
            sessionName={FT.TRAINING_PLAN[sessionId].name}
            onContinue={continueFromRecovery}
            onSkip={skipRecovery}
          />
        </>
      )}
      {screen === 'workout' && (
        <WorkoutScreen theme={theme}
          state={{ ...state, __pendingRecovery: pendingRecovery }}
          setState={setState}
          sessionId={sessionId}
          onExit={() => { setScreen('home'); setPendingRecovery(null); }}
          onComplete={() => { setScreen('home'); setPendingRecovery(null); }}

          onOpenCoach={() => setScreen('coach')}
        />
      )}
      {screen === 'stats' && (
        <StatsScreen theme={theme} state={state} setState={setState}

      )}
      {screen === 'settings' && (
        <SettingsScreen theme={theme} state={state} setState={setState}
          onClose={() => setScreen('home')} />
      )}
      {screen === 'coach' && (
        <CoachScreen theme={theme} state={state} setState={setState}
          onClose={() => setScreen('home')} />

          onClose={() => setPlateModal(null)} />

          onDismiss={() => setCelebrationPRs(null)} />
      )}
    </Frame>
  );
}

window.App = App;

  <script type="text/babel">
/* global React, ReactDOM, THEMES, App, useTweaks, TweaksPanel, TweakSection, TweakColor, TweakSelect, TweakToggle, TweakSlider */
// canvas.jsx — Beast Mode full-bleed prototype + Tweaks panel

// Inject mobile-specific CSS + viewport-fit=cover for safe area insets
(function injectMobileCSS() {
  const vp = document.querySelector('meta[name="viewport"]');
  if (vp && !vp.content.includes('viewport-fit')) {
    vp.content += ', viewport-fit=cover';
  }
  const style = document.createElement('style');
  style.textContent = `
    @media (max-width: 430px) and (pointer: coarse) {
      html, body { overflow: hidden; height: 100dvh; }
      body { background: #0A0908 !important; }
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
  `;
  document.head.appendChild(style);
})();

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#FF4D14",
  "accent2": "#FFB020",
  "displayFont": "Anton",
  "uppercaseHeads": true,
  "glowIntensity": 1
}/*EDITMODE-END*/;

const ACCENT_OPTIONS = [
  '#FF4D14',  // ember (default)
  '#E11D2E',  // blood red
  '#FFB020',  // gold
  '#FF6FB5',  // hot pink
];

const FONT_OPTIONS = ['Anton', 'Bebas Neue', 'Oswald', 'Inter'];

function useIsMobile() {
  const [mobile, setMobile] = React.useState(() => window.innerWidth <= 430 && 'ontouchstart' in window);
  React.useEffect(() => {
    const mq = window.matchMedia('(max-width: 430px) and (pointer: coarse)');
    const update = () => setMobile(mq.matches);
    update();
    mq.addEventListener('change', update);
    return () => mq.removeEventListener('change', update);
  }, []);
  return mobile;
}

function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const isMobile = useIsMobile();

  const theme = React.useMemo(() => {
    const base = window.THEMES.beast;
    return {
      ...base,
      isMobile,
      padTop: isMobile ? 'calc(env(safe-area-inset-top, 20px) + 12px)' : 56,
      padBot: isMobile ? 'calc(env(safe-area-inset-bottom, 0px) + 20px)' : 0,
      accent: t.accent,
      accent2: t.accent2,
      fontDisplay: `"${t.displayFont}", "Bebas Neue", "Oswald", "Inter", sans-serif`,
      upperHeads: t.uppercaseHeads,
      cardShadow: `0 1px 0 rgba(255,255,255,0.04) inset, 0 ${18 * t.glowIntensity}px ${30 * t.glowIntensity}px -22px rgba(0,0,0,0.7), 0 0 ${40 * t.glowIntensity}px -20px ${t.accent}40`,
      bgGrad: `radial-gradient(ellipse at top, ${hexAlpha(t.accent, 0.10 * t.glowIntensity)} 0%, #0A0908 65%)`,
    };
  }, [t.accent, t.accent2, t.displayFont, t.uppercaseHeads, t.glowIntensity, isMobile]);

  const stageRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    if (isMobile) return;
    function fit() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const margin = 40;
      const sx = (vw - margin * 2) / 390;
      const sy = (vh - margin * 2) / 844;
      setScale(Math.min(1.4, Math.min(sx, sy)));
    }
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, [isMobile]);

  if (isMobile) {
    return (
      <div style={{
        width: '100vw', height: '100dvh',
        background: theme.bgGrad, color: theme.text,
        fontFamily: theme.fontUI,
        position: 'relative', overflow: 'hidden',
      }}>
        <App theme={theme} />
      </div>
    );
  }

  return (
    <div style={{
      width: '100vw', height: '100vh',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: '#0A0908',
      backgroundImage: `
        radial-gradient(ellipse at 20% 20%, ${hexAlpha(theme.accent, 0.08)} 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, ${hexAlpha(theme.accent2, 0.05)} 0%, transparent 50%)
      `,
      overflow: 'hidden', position: 'relative',
    }}>
      <div style={{
        position: 'absolute', inset: 0, opacity: 0.04,
        backgroundImage: `linear-gradient(rgba(255,255,255,0.8) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,0.8) 1px, transparent 1px)`,
        backgroundSize: '40px 40px',
        pointerEvents: 'none',
      }} />

      <div ref={stageRef} style={{
        transform: `scale(${scale})`, transformOrigin: 'center',
      }}>
        <App theme={theme} />
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Akzent">
          <TweakColor label="Primärfarbe" value={t.accent}
            options={ACCENT_OPTIONS}
            onChange={v => setTweak('accent', v)} />
          <TweakColor label="Sekundär" value={t.accent2}
            options={['#FFB020', '#84CC16', '#22D3EE', '#F472B6']}
            onChange={v => setTweak('accent2', v)} />
        </TweakSection>

        <TweakSection label="Typografie">
          <TweakSelect label="Display-Font" value={t.displayFont}
            options={FONT_OPTIONS}
            onChange={v => setTweak('displayFont', v)} />
          <TweakToggle label="UPPERCASE Headlines" value={t.uppercaseHeads}
            onChange={v => setTweak('uppercaseHeads', v)} />
        </TweakSection>

        <TweakSection label="Atmosphäre">
          <TweakSlider label="Glow" value={t.glowIntensity} min={0} max={2} step={0.1}
            onChange={v => setTweak('glowIntensity', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

// helper: hex#RRGGBB + alpha → rgba()
function hexAlpha(hex, a) {
  const m = hex.match(/^#?([0-9a-f]{6})$/i);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

  </script>
